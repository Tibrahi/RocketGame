<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RocketGame</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="stylesheet" href="styles/main.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7418496784550790" crossorigin="anonymous"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --dark-bg: #090a0f;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(188, 19, 254, 0.08), transparent 25%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .game-container {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            width: 100%;
            max-width: 1100px;
            padding: 20px;
            justify-content: center;
            align-items: flex-start;
        }

        .last-game-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            min-width: 260px;
            flex: 1 1 250px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .last-game-card h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-purple);
            font-size: 1.2rem;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .last-score {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .score-label {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .score-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .game-content {
            flex: 3 1 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 320px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 24px;
            font-family: 'Orbitron', sans-serif;
        }

        .score {
            font-size: 1.2rem;
            color: var(--neon-blue);
        }

        .speed-indicator {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-size: 0.85rem;
            color: #94a3b8;
            gap: 6px;
        }

        .speed-bar {
            width: 120px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .speed-fill {
            width: 30%; /* Default demo width */
            height: 100%;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            border-radius: 10px;
            box-shadow: 0 0 10px var(--neon-blue);
            transition: width 0.3s ease;
        }

        .game-area {
            position: relative;
            width: 100%;
            height: 500px;
            background-color: #030407;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0));
            background-size: 150px 150px;
            border-radius: 20px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 243, 255, 0.05);
            overflow: hidden;
        }

        .player {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 48px;
            z-index: 5;
            transition: left 0.1s linear, bottom 0.1s linear;
        }

        .rocket {
            width: 100%;
            height: 100%;
            fill: var(--neon-blue);
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.8));
            transform: rotate(-45deg); /* Adjust based on original SVG orientation if needed */
        }

        .game-over-message {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex; /* Assuming JS toggles display:none */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 20px;
        }

        .game-over-message h2 {
            font-family: 'Orbitron', sans-serif;
            color: #ff3366;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }

        .game-over-message p {
            font-size: 1.2rem;
        }

        .final-score {
            font-weight: 800;
            color: var(--neon-blue);
            font-size: 1.5rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            margin-top: 10px;
        }

        #startBtn {
            padding: 16px 48px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #030407;
            background: linear-gradient(45deg, var(--neon-blue), #00a2ff);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transition: all 0.3s ease;
        }

        #startBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.6);
        }

        #startBtn:active {
            transform: translateY(1px);
        }

        .mobile-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .vertical-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mobile-controls button {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            color: #fff;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: all 0.15s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-controls button:active {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--neon-blue);
            transform: scale(0.92);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        @media (max-width: 768px) {
            .game-area {
                height: 400px;
            }
            .last-game-card {
                flex-basis: 100%;
                order: -1;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <aside class="last-game-card">
            <h3>Last Game</h3>
            <div class="last-score">
                <span class="score-label">Score:</span>
                <span class="score-value">0</span>
            </div>
        </aside>
        <div class="game-content">
            <div class="game-header">
                <div class="score">Score: <span id="score">0</span></div>
                <div class="speed-indicator">
                    Speed: <span id="speed">1</span>/24
                    <div class="speed-bar">
                        <div class="speed-fill"></div>
                    </div>
                </div>
            </div>
            <div class="game-area">
                <div class="player">
                    <svg class="rocket" viewBox="0 0 24 24">
                        <path d="M12 2.5c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-2 14l-2-2v-4h2v6zm0 4v-2h2v2h-2zm4-4h-2v-4l2-2v6zm0 4h-2v-2h2v2zm4-4h-2v-6l2 2v4zm0 4h-2v-2h2v2z"/>
                    </svg>
                </div>
                <div class="game-over-message" style="display: none;">
                    <h2>Game Over!</h2>
                    <p>Your score: <span class="final-score">0</span></p>
                </div>
            </div>
            <div class="controls">
                <button id="startBtn">Start Game</button>
                <div class="mobile-controls">
                    <button id="leftBtn">←</button>
                    <div class="vertical-controls">
                        <button id="upBtn">↑</button>
                        <button id="downBtn">↓</button>
                    </div>
                    <button id="rightBtn">→</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/game.js"></script>
</body>
</html>
